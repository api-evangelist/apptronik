aid: apptronik
name: Apptronik
description: >-
  Apptronik is an Austin, Texas-based humanoid robotics company founded in
  2016 as a spinout from the Human Centered Robotics Lab at the University of
  Texas at Austin. Co-founded by Jeff Cardenas (CEO), Dr. Nick Paine (CTO),
  and Dr. Luis Sentis (scientific advisor), the company designs and
  manufactures Apollo, a general-purpose humanoid robot standing 5'8", weighing
  160 lbs, capable of lifting 55 lbs, and running for roughly 4 hours on a
  swappable battery. Apollo targets warehouse, manufacturing, and logistics
  applications including trailer unloading, case picking, palletization,
  machine tending, and workcell delivery. Apptronik has commercial pilot
  programs and partnerships with Mercedes-Benz (automotive manufacturing
  logistics), GXO Logistics (multi-phase R&D in U.S. distribution centers),
  Jabil (supply-chain partner helping scale production and an internal Apollo
  deployment), and Google DeepMind (Apollo integrates Gemini Robotics
  vision-language-action models). The company previously built NASA's Valkyrie
  humanoid and ten-plus other research robots. As of February 2026 Apptronik
  had raised more than $935M (including a $520M Series A-X extension) at a
  reported $5B valuation, with investors including B Capital, Google, and
  Mercedes-Benz. The company sells/leases Apollo to enterprise customers via a
  direct contact-sales motion and ships a proprietary "point-and-click"
  control suite for deploying solutions; there is no public developer portal,
  no published REST/AsyncAPI/gRPC API, no public SDK, no open-source release,
  and no public GitHub repositories under the `apptronik` org.
